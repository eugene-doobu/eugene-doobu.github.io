<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Models - Snack Eater Studio</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <!-- Google model-viewer -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>
    <!-- Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2592047569720319"
        crossorigin="anonymous"></script>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="../index.html" class="nav-brand">
                <h1>간식축내는 스튜디오</h1>
            </a>
            <ul class="nav-menu">
                <li><a href="../index.html">Home</a></li>
                <li><a href="../index.html#games">Games</a></li>
                <li><a href="index.html" class="active">Models</a></li>
                <li><a href="../index.html#about">About</a></li>
                <li><button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme">🌙</button></li>
            </ul>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="models-hero">
        <div class="hero-content">
            <h1>3D Model Gallery</h1>
            <p>무료로 다운로드 가능한 3D 모델 컬렉션</p>
        </div>
    </section>

    <!-- Ad: Header Banner -->
    <div class="ad-container ad-header">
        <ins class="adsbygoogle"
            style="display:block"
            data-ad-client="ca-pub-2592047569720319"
            data-ad-slot="auto"
            data-ad-format="horizontal"
            data-full-width-responsive="true"></ins>
        <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
    </div>

    <!-- Main Content -->
    <main class="models-main">
        <!-- Sidebar with Filters -->
        <aside class="filters-sidebar">
            <div class="filter-section">
                <h3>카테고리</h3>
                <div class="category-filters" id="category-filters">
                    <!-- Generated by JS -->
                </div>
            </div>

            <div class="filter-section">
                <h3>태그</h3>
                <div class="tag-filters" id="tag-filters">
                    <!-- Generated by JS -->
                </div>
            </div>

            <!-- Sidebar Ad -->
            <div class="ad-container ad-sidebar-models">
                <ins class="adsbygoogle"
                    style="display:block"
                    data-ad-client="ca-pub-2592047569720319"
                    data-ad-slot="auto"
                    data-ad-format="vertical"
                    data-full-width-responsive="false"></ins>
                <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
            </div>
        </aside>

        <!-- Models Grid -->
        <section class="models-content">
            <div class="models-header">
                <p class="models-count"><span id="model-count">0</span>개의 모델</p>
                <div class="sort-options">
                    <select id="sort-select">
                        <option value="newest">최신순</option>
                        <option value="oldest">오래된순</option>
                        <option value="name">이름순</option>
                    </select>
                </div>
            </div>

            <div class="models-grid" id="models-grid">
                <!-- Generated by JS -->
            </div>

            <div class="loading-indicator" id="loading">
                <div class="spinner"></div>
                <p>모델 불러오는 중...</p>
            </div>
        </section>
    </main>

    <!-- 3D Viewer Modal -->
    <div class="modal" id="viewer-modal">
        <div class="modal-backdrop"></div>
        <div class="modal-content">
            <button class="modal-close" id="modal-close">&times;</button>
            <div class="modal-body">
                <div class="viewer-container">
                    <model-viewer
                        id="model-viewer"
                        camera-controls
                        auto-rotate
                        shadow-intensity="1"
                        exposure="1"
                        ar
                    ></model-viewer>
                </div>
                <div class="model-details" id="model-details">
                    <h2 id="detail-name">Model Name</h2>
                    <p id="detail-description">Description</p>
                    <div class="detail-meta">
                        <span id="detail-poly">Poly: 0</span>
                        <span id="detail-license">License: CC BY</span>
                    </div>
                    <div class="detail-tags" id="detail-tags"></div>
                    <div class="download-buttons" id="download-buttons">
                        <!-- Generated by JS -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Ad: Before Footer -->
    <div class="ad-container ad-before-footer">
        <ins class="adsbygoogle"
            style="display:block"
            data-ad-client="ca-pub-2592047569720319"
            data-ad-slot="auto"
            data-ad-format="horizontal"
            data-full-width-responsive="true"></ins>
        <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-brand">
                    <h3>간식축내는 스튜디오</h3>
                    <p>혁신적인 게임 경험을 만드는 인디 스튜디오</p>
                </div>
                <div class="footer-links">
                    <h4>Links</h4>
                    <a href="../index.html">Home</a>
                    <a href="../index.html#games">Games</a>
                    <a href="index.html">Models</a>
                </div>
                <div class="footer-links">
                    <h4>Support</h4>
                    <a href="https://github.com/eugene-doobu/eugene-doobu.github.io/issues" target="_blank">문의하기</a>
                    <a href="https://github.com/eugene-doobu" target="_blank">GitHub</a>
                </div>
            </div>
            <div class="footer-bottom">
                <p>© 2025 간식축내는 스튜디오. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
